name: Verify release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify baseline tag
        run: git rev-parse --verify 'starter-v0.1.0^{commit}'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run deterministic tests
        run: npm test
      - name: Build production artifact
        run: npm run build
      - name: Check repository submission gates
        run: npm run check:submission
      - name: Confirm verification did not rewrite tracked evidence
        run: git diff --exit-code
